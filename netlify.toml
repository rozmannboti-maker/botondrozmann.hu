# 2026-11-09: az rb-oldal (Vite) a botondrozmann.hu-n; a Netlify minden push után újraépíti.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# 2026-11-11 (PageSpeed: gyorsítótár-élettartam): a képek, videók, betűk és a buildelt JS/CSS
# 30 napig a böngészőben maradnak. A HTML nem (az mindig friss, és a CSS már benne van).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/konyv/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
